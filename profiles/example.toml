# 读者画像示例。复制成 profiles/personal.toml（或任意 NAME.toml，用 DIGEST_PROFILE=NAME 选择）后按自己的情况改。
# 改这个文件就能调整日报的方向，不用改提示词。自建的画像不会进仓库（见 .gitignore）。

name = "示例"

# ---------- 卡片 1：读者是谁（决定怎么解释，不决定选什么）----------
[audience]
who = "计算机方向研究生，关注 AI 研究进展。"
# 这些概念不必解释
known = ["LLM", "智能体", "基准与评测", "强化学习基础", "Lean/Isabelle", "miniF2F", "统计学"]
# 这些领域的术语要加注释
unfamiliar = ["密码学", "生物与湿实验", "商业金融术语", "硬件和基础设施公司"]

# ---------- 卡片 2：关注方向与大致比例（决定选什么）----------
# share 是参考比例，合计 100；某天内容不够时不硬凑。
[[focus]]
name = "多模态"
share = 20
topics = "视觉语言模型、多模态推理（图表、几何、视频理解）、图像与视频生成、多模态基准"

[[focus]]
name = "LLM 推理与后训练"
share = 15
topics = "推理模型、强化学习后训练、测试时计算、长思维链"

[[focus]]
name = "智能体"
share = 15
topics = "编码与科研智能体、长程任务、工具使用、智能体评测"

[[focus]]
name = "评测方法"
share = 10
topics = "新基准、评测效度、第三方评测、污染与可复现性"

[[focus]]
name = "AI for Math 与形式化"
share = 10
topics = "定理证明、自动形式化、Lean/Isabelle、数学发现"

[[focus]]
name = "基础模型与产业"
share = 15
topics = "前沿模型发布、开放权重模型、研究者对算力、商业模式和进展速度的判断"

[[focus]]
name = "具身、世界模型与 AI for Science"
share = 10
topics = "机器人、世界模型、生物和材料等科学应用"

[[focus]]
name = "AI 系统与效率"
share = 5
topics = "训练与推理效率、架构、开源工具"

# ---------- 卡片 3：个人研究（可选，只用于“和你的研究”）----------
